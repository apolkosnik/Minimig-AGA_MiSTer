[Library]
others = $MODEL_TECH/../std
std = $MODEL_TECH/../std
ieee = $MODEL_TECH/../ieee
verilog = $MODEL_TECH/../verilog
vital2000 = $MODEL_TECH/../vital2000
vl = $MODEL_TECH/../vl
synopsys = $MODEL_TECH/../synopsys
modelsim_lib = $MODEL_TECH/../modelsim_lib
work = work

[vcom]
; Change VHDL source file compile order from file order to dependency order
; set to 1 to change to dependency order
BuildOrder = 1

[vsim]
; Specify default options for the restart command. Options can be one
; or more of: -force -nobreakpoint -nolist -nolog -nowave
DefaultRestartOptions = -force

[Transcript]
; Change the transcript behavior so that when the user types in transcript window
; ModelSim will automatically scroll to the bottom of the transcript. 
TranscriptForward = 1